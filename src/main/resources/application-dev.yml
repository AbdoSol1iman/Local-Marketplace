# ─────────────────────────────────────────────────────────────────────────────
# Development profile — activate with: --spring.profiles.active=dev
# WARNING: These settings are UNSAFE for production. Never deploy with dev profile.
# ─────────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wafrnalak_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  flyway:
    locations: classpath:db/migration,classpath:db/dev
  jpa:
    show-sql: true
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Allows all endpoints to be called without a real Firebase token.
# Customer identity is read from the X-Customer-Id request header.
security:
  insecure-test-mode: true

app:
  security:
    public-docs-enabled: true

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-1234567890123456}
