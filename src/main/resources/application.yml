server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL}
    # DB_USERNAME and DB_PASSWORD have no defaults — must be set via environment.
    # For local dev, activate the 'dev' profile: --spring.profiles.active=dev
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  application:
    name: wafrnalak-marketplace

# Security
# insecure-test-mode=false is the safe default for any deployed environment.
# Set to true ONLY via the dev profile (application-dev.yml) — never in prod.
security:
  insecure-test-mode: false

# JWT — will be activated when Firebase auth filter is wired in.
# JWT_SECRET must be provided via environment variable — no default to prevent
# insecure deployments. Minimum recommended length: 32 characters (256 bits).
# Example: export JWT_SECRET=$(openssl rand -base64 32)
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours in ms

springdoc:
  api-docs:
    enabled: false
    path: /api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

app:
  security:
    public-docs-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: db,ping
        liveness:
          include: ping
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: wafrnalak-marketplace

logging:
  level:
    root: INFO
  pattern:
    console: "ts=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level thread=%thread logger=%logger{36} msg=%msg%n"
