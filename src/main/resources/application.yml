server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wafrnalak_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  application:
    name: wafrnalak-marketplace

# JWT — will be activated when Firebase auth filter is wired in.
# JWT_SECRET must be provided via environment variable — no default to prevent
# insecure deployments. Minimum recommended length: 32 characters (256 bits).
# Example: export JWT_SECRET=$(openssl rand -base64 32)
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000 # 24 hours in ms

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
